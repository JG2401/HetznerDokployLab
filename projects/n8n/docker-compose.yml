services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.29.10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    restart: always
    labels:
      - rclone.storage=storagebox-crypt
    environment:
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=${N8N_PORT}
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${N8N_HOST}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - N8N_SECURE_COOKIE=true
      - N8N_RESTRICT_FILE_ACCESS_TO=/home/node
    volumes:
      - /opt/media/storagebox/paperless/consume:/home/node/paperless/consume:rw
      - n8n_data:/home/node/.n8n
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 10 ls /home/node/paperless/consume >/dev/null 2>&1 || exit 1"
        ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

volumes:
  n8n_data:
