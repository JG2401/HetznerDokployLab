services:
  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:2.37.2
    restart: unless-stopped
    expose:
      - 80
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 10 ls /audiobooks >/dev/null 2>&1 || exit 1"
        ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    environment:
      - TZ=Europe/Berlin
    volumes:
      - config:/config
      - metadata:/metadata
      - /opt/media/seedbox/media:/audiobooks:ro

volumes:
  config: {}
  metadata: {} 