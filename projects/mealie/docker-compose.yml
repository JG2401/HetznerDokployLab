services:
  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.29.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    labels:
      - rclone.storage=storagebox-crypt
    volumes:
      - type: bind
        source: /opt/media/storagebox/mealie
        target: /app/data/
        bind:
          propagation: rslave
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 10 ls /app/data >/dev/null 2>&1 || exit 1"
        ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    environment:
      PUID: 1000
      PGID: 1000

      # Basic settings
      BASE_URL: ${BASE_URL}
      API_DOCS: ${API_DOCS}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP}
      DEFAULT_GROUP: ${DEFAULT_GROUP}
      DEFAULT_HOUSEHOLD: ${DEFAULT_HOUSEHOLD}
      TZ: ${TZ}
      SECURITY_MAX_LOGIN_ATTEMPTS: ${SECURITY_MAX_LOGIN_ATTEMPTS}
      SECURITY_USER_LOCKOUT_TIME: ${SECURITY_USER_LOCKOUT_TIME}
      DAILY_SCHEDULE_TIME: ${DAILY_SCHEDULE_TIME}

      # Email settings
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_AUTH_STRATEGY: ${SMTP_AUTH_STRATEGY}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    restart: unless-stopped
