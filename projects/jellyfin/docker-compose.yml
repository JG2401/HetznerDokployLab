version: "3.8"
services:
  jellyfin:
    image: jellyfin/jellyfin:12
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    volumes:
      - config:/config
      - cache:/cache
      - /opt/media/seedbox/media:/media:ro
    restart: "unless-stopped"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 10 ls /media >/dev/null 2>&1 || exit 1"
        ]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    environment:
      - JELLYFIN_PublishedServerUrl=https://${JELLYFIN_HOST}
    extra_hosts:
      - "host.docker.internal:host-gateway"
volumes:
  config:
  cache:
  media:
